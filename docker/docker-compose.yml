version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. MySQL 8 Relational Database
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: academiq-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-academic_ai_db}
      MYSQL_USER: ${DB_USER:-academiq_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # 2. Qdrant Dedicated Vector Database
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: academiq-qdrant
    restart: always
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # HTTP REST API & Web Dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334" # High-performance gRPC (Spring AI)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Java Spring Boot 3.3 Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: academiq-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-academic_ai_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-mock-key}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JWT_SECRET: ${JWT_SECRET:-universityAcademicAssistantSecretKeyWithAtLeast256BitsLengthForHS256Security2026}
    volumes:
      - uploads_data:/app/uploads

  # ---------------------------------------------------------------------------
  # 4. React 18 + Vite Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: academiq-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  qdrant_data:
  uploads_data:
